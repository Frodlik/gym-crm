spring:
  application:
    name: integration-tests
  datasource:
    url: jdbc:mysql://localhost:3307/gym_crm_test
    username: testuser
    password: testpass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    mongodb:
      uri: mongodb://localhost:27018/testdb
      database: testdb

jwt:
  secret: test-secret-key-for-integration-tests-minimum-32-characters